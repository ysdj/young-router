services:
  young-router:
    image: ${YOUNG_ROUTER_IMAGE:-ghcr.io/ysdj/young-router:main}
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${YOUNG_ROUTER_PORT:-12390}:12390"
    environment:
      LITELLM_NUM_WORKERS: ${YOUNG_ROUTER_WORKERS:-2}
    volumes:
      - router-data:/data
    shm_size: 256m
    stop_grace_period: 45s

volumes:
  router-data:
