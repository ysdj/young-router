name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    # React Native 0.85 refuses to configure below Xcode 16.1, and the
    # macos-14 image selects 15.4. That image is also deprecated (unsupported
    # from 2026-11-02), so the job runs on the image whose default already
    # satisfies the requirement and reserves the right to stop existing.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Assert the Xcode React Native 0.85 requires
        run: |
          # `use_react_native!` raises "Please upgrade XCode" below 16.1, and a
          # runner image's default selection is not a promise: the failure
          # otherwise surfaces much later as an invalid Podfile, which reads as
          # a broken project rather than an unsuitable toolchain. State the
          # requirement here so it reports itself in one line.
          installed="$(xcodebuild -version | awk 'NR==1 {print $2}')"
          printf 'Xcode %s is selected.\n' "$installed"
          if [[ "$(printf '%s\n' 16.1 "$installed" | sort -V | head -1)" != "16.1" ]]; then
            echo "React Native 0.85 requires Xcode >= 16.1, but $installed is selected." >&2
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: rn/pnpm-lock.yaml

      - name: Bootstrap pinned react-native-macos 0.85 source
        working-directory: rn
        run: node scripts/bootstrap-rnmacos-085.mjs

      - name: Install React Native dependencies
        working-directory: rn
        run: pnpm install --frozen-lockfile

      - name: Install test dependencies
        run: |
          brew install uv
          uv venv --python 3.12 "$RUNNER_TEMP/young-router-ci"
          uv pip install --python "$RUNNER_TEMP/young-router-ci/bin/python" "litellm[proxy]==$(tr -d '[:space:]' < LITELLM_VERSION)" "fastapi==0.140.3" PyYAML Pillow

      - name: Run full test suite
        env:
          LITELLM_TEST_PYTHON: ${{ runner.temp }}/young-router-ci/bin/python
          YOUNG_ROUTER_AUTO_BUILD: "0"
        run: ./scripts/test.sh

      - name: Check shared React Native contract
        run: ./scripts/check-rn.sh

      - name: Build React Native macOS host
        env:
          YOUNG_ROUTER_MACOS_OUTPUT: ${{ runner.temp }}/Young Router.app
          YOUNG_ROUTER_REFRESH_PODS: "1"
        working-directory: rn
        run: pnpm run build:macos

      - name: Verify React Native macOS bundle
        env:
          APP: ${{ runner.temp }}/Young Router.app
        run: |
          test -x "$APP/Contents/MacOS/YoungRouter"
          test -x "$APP/Contents/Resources/Core/runtime/bin/python"
          test -x "$APP/Contents/Resources/Core/runtime/bin/litellm"
          test -f "$APP/Contents/Resources/Core/sitecustomize.py"
          plutil -lint "$APP/Contents/Info.plist"
          test "$(plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist")" = "$(tr -d '[:space:]' < VERSION)"
          test "$(plutil -extract CFBundleVersion raw "$APP/Contents/Info.plist")" = "$(tr -d '[:space:]' < BUILD_NUMBER)"
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$APP/Contents/Resources/Core" \
            "$APP/Contents/Resources/Core/runtime/bin/python" -c \
            'import litellm.proxy.proxy_server, young_router.core'
          PYTHONDONTWRITEBYTECODE=1 YOUNG_ROUTER_PROXY_PROCESS=1 \
            PYTHONPATH="$APP/Contents/Resources/Core" \
            "$APP/Contents/Resources/Core/runtime/bin/python" -c \
            'from litellm.proxy.types_utils.utils import get_instance_fn; callback = get_instance_fn("young_router.callbacks.image_generation_routing_hook", config_file_path="runtime/config.yaml"); assert callback.__class__.__name__ == "YoungRouterHook"'
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Validate scripts and metadata
        shell: bash
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache
        run: |
          while IFS= read -r -d '' file; do
            [[ -f "$file" ]] || continue
            bash -n "$file"
          done < <(git ls-files -z '*.sh')

          while IFS= read -r -d '' file; do
            [[ -f "$file" ]] || continue
            zsh -n "$file"
          done < <(git ls-files -z '*.zsh')

          while IFS= read -r -d '' file; do
            [[ -f "$file" ]] || continue
            "$RUNNER_TEMP/young-router-ci/bin/python" -m py_compile "$file"
          done < <(git ls-files -z '*.py')

          ruby -c Casks/young-router.rb
          brew style Casks/young-router.rb

          "$RUNNER_TEMP/young-router-ci/bin/python" scripts/version.py sync
          git diff --exit-code -- \
            VERSION BUILD_NUMBER Casks/young-router.rb \
            rn/apps/macos/macos/YoungRouter-macOS/Info.plist \
            rn/apps/macos/macos/YoungRouter.xcodeproj/project.pbxproj \
            rn/apps/windows/windows/YoungRouter/Package.appxmanifest \
            rn/apps/windows/windows/YoungRouter.Package/Package.appxmanifest

          while IFS= read -r -d '' file; do
            [[ -f "$file" ]] || continue
            plutil -lint "$file"
          done < <(git ls-files -z '*.plist')

  rn-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: rn/pnpm-lock.yaml
      - name: Install shared UI dependencies
        working-directory: rn
        run: pnpm install --filter @young-router/rn-app --frozen-lockfile
      - name: Check shared RN contract
        run: ./scripts/check-rn.sh

  windows-rn:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: rn/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v5
      - name: Install shared UI dependencies
        working-directory: rn
        run: pnpm install --filter @young-router/rn-app --frozen-lockfile
      - name: Check shared RN contract and types
        working-directory: rn
        run: pnpm run build
      - name: Build React Native Windows host
        working-directory: rn
        run: pnpm run build:windows
