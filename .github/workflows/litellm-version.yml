name: LiteLLM version policy

on:
  # Manual only, like every workflow here: the pin moves when a person moves it.
  # The check is `./scripts/update-litellm.sh --check`, which a local run answers
  # in a second without a runner.
  workflow_dispatch:

jobs:
  latest-development-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require latest stable LiteLLM during development
        run: ./scripts/update-litellm.sh --check
